<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Standard residual connections compared with Attention Residuals</title>
  <desc id="desc">Standard residuals form a fixed running sum over depth. Attention Residuals use learned softmax weights to select earlier representations.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .heading { font-size: 23px; font-weight: 700; fill: #111827; }
      .subheading { font-size: 15px; fill: #6b7280; }
      .formula { font-size: 17px; fill: #111827; }
      .node-title { font-size: 16px; font-weight: 700; fill: #111827; }
      .node-note { font-size: 14px; fill: #4b5563; }
      .callout-title { font-size: 17px; font-weight: 700; fill: #111827; }
      .callout { font-size: 15px; fill: #4b5563; }
      .alpha { font-size: 13px; fill: #7c3aed; }
    </style>
  </defs>

  <rect width="1440" height="820" rx="18" fill="#ffffff"/>

  <!-- Standard residuals -->
  <rect x="40" y="35" width="660" height="750" rx="18" fill="#fafaf9" stroke="#d6d3d1" stroke-width="2"/>
  <text class="sans heading" x="72" y="82">Classic PreNorm residual</text>
  <text class="sans subheading" x="72" y="111">One running state accumulates every layer output with weight 1</text>

  <rect x="72" y="140" width="596" height="92" rx="12" fill="#ffffff" stroke="#d6d3d1"/>
  <text class="mono formula" x="98" y="178">hₗ = hₗ₋₁ + fₗ₋₁(hₗ₋₁)</text>
  <text class="mono formula" x="98" y="209">= h₁ + Σᶫ⁻¹ᵢ₌₁ fᵢ(hᵢ)</text>

  <rect x="80" y="335" width="140" height="62" rx="11" fill="#f3f4f6" stroke="#9ca3af"/>
  <text class="sans node-title" x="150" y="372" text-anchor="middle">Embedding h₁</text>

  <circle cx="315" cy="366" r="25" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text class="sans heading" x="315" y="374" text-anchor="middle">+</text>

  <rect x="385" y="335" width="120" height="62" rx="11" fill="#f3f4f6" stroke="#9ca3af"/>
  <text class="sans node-title" x="445" y="372" text-anchor="middle">h₂</text>

  <circle cx="575" cy="366" r="25" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text class="sans heading" x="575" y="374" text-anchor="middle">+</text>

  <rect x="610" y="335" width="58" height="62" rx="11" fill="#f3f4f6" stroke="#9ca3af"/>
  <text class="sans node-title" x="639" y="372" text-anchor="middle">h₃</text>

  <rect x="245" y="268" width="140" height="48" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text class="mono node-note" x="315" y="298" text-anchor="middle">f₁(h₁)</text>

  <rect x="505" y="268" width="140" height="48" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text class="mono node-note" x="575" y="298" text-anchor="middle">f₂(h₂)</text>

  <line x1="220" y1="366" x2="282" y2="366" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="366" x2="377" y2="366" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="505" y1="366" x2="542" y2="366" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="366" x2="602" y2="366" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="315" y1="316" x2="315" y2="333" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="575" y1="316" x2="575" y2="333" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="72" y="470" width="596" height="126" rx="12" fill="#fff7ed" stroke="#fb923c"/>
  <text class="sans callout-title" x="98" y="508">Depth routing is fixed</text>
  <text class="sans callout" x="98" y="541">Each layer sees only hₗ₋₁, a compressed sum of everything before it.</text>
  <text class="sans callout" x="98" y="570">Earlier contributions cannot be individually emphasized or suppressed.</text>

  <rect x="72" y="634" width="596" height="104" rx="12" fill="#f3f4f6"/>
  <text class="sans node-title" x="98" y="672">State carried across depth</text>
  <text class="mono formula" x="98" y="706">one vector · O(d)</text>

  <!-- Attention Residuals -->
  <rect x="740" y="35" width="660" height="750" rx="18" fill="#fafaf9" stroke="#818cf8" stroke-width="2"/>
  <text class="sans heading" x="772" y="82">Attention Residuals (AttnRes)</text>
  <text class="sans subheading" x="772" y="111">A learned pseudo-query selects useful representations across depth</text>

  <rect x="772" y="140" width="596" height="92" rx="12" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="mono formula" x="798" y="178">hₗ = Σᵢ αᵢ→ₗ vᵢ</text>
  <text class="mono formula" x="798" y="209">αᵢ→ₗ = softmaxᵢ(wₗᵀ RMSNorm(vᵢ))</text>

  <rect x="772" y="266" width="172" height="48" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text class="sans node-note" x="858" y="296" text-anchor="middle">Embedding b₀</text>

  <rect x="772" y="330" width="172" height="48" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text class="sans node-note" x="858" y="360" text-anchor="middle">Completed group b₁</text>

  <rect x="772" y="394" width="172" height="48" rx="10" fill="#f3f4f6" stroke="#9ca3af"/>
  <text class="sans node-note" x="858" y="424" text-anchor="middle">Completed group b₂</text>

  <rect x="772" y="458" width="172" height="58" rx="10" fill="#eef2ff" stroke="#818cf8"/>
  <text class="sans node-note" x="858" y="482" text-anchor="middle">Current partial group</text>
  <text class="mono node-note" x="858" y="503" text-anchor="middle">bₙ⁽ⁱ⁻¹⁾</text>

  <rect x="1020" y="336" width="176" height="110" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text class="sans node-title" x="1108" y="374" text-anchor="middle">Depth-wise</text>
  <text class="sans node-title" x="1108" y="398" text-anchor="middle">softmax attention</text>
  <text class="sans node-note" x="1108" y="426" text-anchor="middle">weights α</text>

  <rect x="1033" y="260" width="150" height="48" rx="10" fill="#fff7ed" stroke="#fb923c"/>
  <text class="mono node-note" x="1108" y="290" text-anchor="middle">pseudo-query wₗ</text>

  <rect x="1244" y="360" width="124" height="62" rx="11" fill="#eef2ff" stroke="#818cf8"/>
  <text class="sans node-title" x="1306" y="386" text-anchor="middle">Selected</text>
  <text class="mono node-note" x="1306" y="408" text-anchor="middle">hₗ</text>

  <line x1="944" y1="290" x2="1012" y2="360" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="944" y1="354" x2="1012" y2="378" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="944" y1="418" x2="1012" y2="402" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="944" y1="487" x2="1012" y2="426" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1108" y1="308" x2="1108" y2="328" stroke="#fb923c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1196" y1="391" x2="1236" y2="391" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="sans alpha" x="970" y="281">α₀</text>
  <text class="sans alpha" x="970" y="346">α₁</text>
  <text class="sans alpha" x="970" y="414">α₂</text>
  <text class="sans alpha" x="970" y="480">αₙ</text>

  <rect x="772" y="548" width="596" height="112" rx="12" fill="#ecfdf5" stroke="#34d399"/>
  <text class="sans callout-title" x="798" y="586">Depth routing is input-dependent</text>
  <text class="sans callout" x="798" y="619">Each module can emphasize or suppress earlier representations.</text>
  <text class="sans callout" x="798" y="646">Kimi K3 uses block-level summaries rather than every sublayer output.</text>

  <rect x="772" y="682" width="596" height="56" rx="12" fill="#f3f4f6"/>
  <text class="sans node-title" x="798" y="717">Block AttnRes state: N group summaries · O(Nd)</text>
</svg>
