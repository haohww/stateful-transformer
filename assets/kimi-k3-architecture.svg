<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" role="img" aria-labelledby="title desc">
  <title id="title">Kimi K3 hybrid Transformer architecture</title>
  <desc id="desc">Twenty-three hybrid groups of three KDA-based Transformer layers and one Gated-MLA-based Transformer layer, followed by a final Gated-MLA-based layer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#6b7280"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .title{font-size:25px;font-weight:700;fill:#111827}.subtitle{font-size:16px;fill:#6b7280}
      .group-title{font-size:19px;font-weight:700;fill:#374151}.name{font-size:20px;font-weight:700}
      .note{font-size:15px}.small{font-size:14px;fill:#6b7280}
    </style>
  </defs>
  <rect width="1000" height="1100" rx="18" fill="#fff"/>
  <text class="sans title" x="500" y="42" text-anchor="middle">Kimi K3 hybrid backbone</text>
  <text class="sans subtitle" x="500" y="70" text-anchor="middle">93 Transformer layers = 23 × (3 KDA + 1 Gated MLA) + 1 final Gated MLA</text>

  <rect x="350" y="98" width="300" height="66" rx="12" fill="#f7f7f5" stroke="#9ca3af" stroke-width="2"/>
  <text class="sans name" x="500" y="139" text-anchor="middle" fill="#111827">Token stream</text>
  <line x1="500" y1="164" x2="500" y2="196" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="110" y="202" width="780" height="650" rx="18" fill="#fffde7" stroke="#c7b94b" stroke-width="2"/>
  <text class="sans group-title" x="500" y="239" text-anchor="middle">Hybrid group × 23 · four Transformer layers per group</text>

  <rect x="220" y="270" width="560" height="104" rx="13" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="sans name" x="500" y="310" text-anchor="middle" fill="#7c2d12">KDA-based Transformer layer</text>
  <text class="sans note" x="500" y="344" text-anchor="middle" fill="#9a3412">KDA token mixer → Stable LatentMoE</text>
  <line x1="500" y1="374" x2="500" y2="405" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="411" width="560" height="104" rx="13" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="sans name" x="500" y="451" text-anchor="middle" fill="#7c2d12">KDA-based Transformer layer</text>
  <text class="sans note" x="500" y="485" text-anchor="middle" fill="#9a3412">KDA token mixer → Stable LatentMoE</text>
  <line x1="500" y1="515" x2="500" y2="546" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="220" y="552" width="560" height="104" rx="13" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="sans name" x="500" y="592" text-anchor="middle" fill="#7c2d12">KDA-based Transformer layer</text>
  <text class="sans note" x="500" y="626" text-anchor="middle" fill="#9a3412">KDA token mixer → Stable LatentMoE</text>
  <line x1="500" y1="656" x2="500" y2="687" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="190" y="693" width="620" height="112" rx="13" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text class="sans name" x="500" y="735" text-anchor="middle" fill="#312e81">Gated-MLA-based Transformer layer</text>
  <text class="sans note" x="500" y="770" text-anchor="middle" fill="#3730a3">Gated MLA token mixer → Stable LatentMoE</text>

  <line x1="500" y1="805" x2="500" y2="880" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="552" y="832" width="142" height="28" rx="6" fill="#fff"/>
  <text class="sans small" x="562" y="851">after group 23</text>

  <rect x="160" y="886" width="680" height="124" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text class="sans name" x="500" y="927" text-anchor="middle" fill="#312e81">Final Gated-MLA-based Transformer layer</text>
  <text class="sans note" x="500" y="961" text-anchor="middle" fill="#3730a3">Gated MLA token mixer → Stable LatentMoE</text>
  <text class="sans small" x="500" y="990" text-anchor="middle">The final token mixer is global</text>

  <line x1="500" y1="1010" x2="500" y2="1036" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="390" y="1042" width="220" height="48" rx="11" fill="#f7f7f5" stroke="#9ca3af"/>
  <text class="sans name" x="500" y="1073" text-anchor="middle" fill="#111827">Output</text>
</svg>
