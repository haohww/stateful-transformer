<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Evolution from linear attention to Kimi Delta Attention</title>
  <desc id="desc">Four recurrent attention mechanisms shown as an evolution, with their state-transition formulas.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .section { font-size: 22px; font-weight: 700; fill: #111827; }
      .name { font-size: 21px; font-weight: 700; }
      .summary { font-size: 15px; fill: #4b5563; }
      .citation { font-size: 14px; fill: #6b7280; }
      .formula-name { font-size: 19px; font-weight: 700; fill: #111827; }
      .formula { font-size: 18px; fill: #111827; }
      .formula-note { font-size: 14px; fill: #6b7280; }
      .edge-note { font-size: 14px; fill: #6b7280; }
    </style>
  </defs>

  <rect width="1440" height="960" rx="18" fill="#ffffff"/>
  <text class="sans section" x="48" y="48">Evolution</text>
  <text class="sans section" x="500" y="48">State transition</text>

  <!-- Linear Attention -->
  <rect x="48" y="78" width="360" height="130" rx="14" fill="#f7f7f5" stroke="#9ca3af" stroke-width="2"/>
  <text class="sans name" x="228" y="119" text-anchor="middle" fill="#111827">Linear Attention</text>
  <text class="sans summary" x="228" y="149" text-anchor="middle">Add every key-value association</text>
  <text class="sans citation" x="228" y="181" text-anchor="middle">Katharopoulos et al. · 2020</text>

  <rect x="500" y="78" width="892" height="130" rx="14" fill="#fafaf9" stroke="#d6d3d1" stroke-width="2"/>
  <text class="sans formula-name" x="530" y="118">Linear Attention</text>
  <text class="mono formula" x="530" y="157">Sₜ = Sₜ₋₁ + kₜvₜᵀ</text>
  <text class="sans formula-note" x="530" y="185">Purely additive memory</text>

  <!-- DeltaNet -->
  <rect x="48" y="288" width="360" height="130" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text class="sans name" x="228" y="329" text-anchor="middle" fill="#064e3b">DeltaNet</text>
  <text class="sans summary" x="228" y="359" text-anchor="middle">Correct the value at the current key</text>
  <text class="sans citation" x="228" y="391" text-anchor="middle">Schlag et al. · 2021</text>

  <rect x="500" y="288" width="892" height="130" rx="14" fill="#fafaf9" stroke="#d6d3d1" stroke-width="2"/>
  <text class="sans formula-name" x="530" y="328">DeltaNet</text>
  <text class="mono formula" x="530" y="367">Sₜ = (I − βₜkₜkₜᵀ)Sₜ₋₁ + βₜkₜvₜᵀ</text>
  <text class="sans formula-note" x="530" y="395">Targeted erase, then write</text>

  <!-- Gated DeltaNet -->
  <rect x="48" y="498" width="360" height="130" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <text class="sans name" x="228" y="539" text-anchor="middle" fill="#312e81">Gated DeltaNet</text>
  <text class="sans summary" x="228" y="569" text-anchor="middle">Add token-wise scalar forgetting</text>
  <text class="sans citation" x="228" y="601" text-anchor="middle">Yang et al. · ICLR 2025</text>

  <rect x="500" y="498" width="892" height="130" rx="14" fill="#fafaf9" stroke="#d6d3d1" stroke-width="2"/>
  <text class="sans formula-name" x="530" y="538">Gated DeltaNet</text>
  <text class="mono formula" x="530" y="577">Sₜ = αₜ(I − βₜkₜkₜᵀ)Sₜ₋₁ + βₜkₜvₜᵀ</text>
  <text class="sans formula-note" x="530" y="605">Scalar decay + targeted correction</text>

  <!-- Kimi Delta Attention -->
  <rect x="48" y="708" width="360" height="130" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text class="sans name" x="228" y="749" text-anchor="middle" fill="#7c2d12">Kimi Delta Attention</text>
  <text class="sans summary" x="228" y="779" text-anchor="middle">Use channel-wise forgetting</text>
  <text class="sans citation" x="228" y="811" text-anchor="middle">Kimi Team · 2025</text>

  <rect x="500" y="708" width="892" height="130" rx="14" fill="#fafaf9" stroke="#fb923c" stroke-width="2"/>
  <text class="sans formula-name" x="530" y="748">Kimi Delta Attention</text>
  <text class="mono formula" x="530" y="787">Sₜ = (I − βₜkₜkₜᵀ)Diag(αₜ)Sₜ₋₁ + βₜkₜvₜᵀ</text>
  <text class="sans formula-note" x="530" y="815">Channel-wise decay + targeted correction</text>

  <!-- Evolution arrows and cross-references -->
  <line x1="228" y1="208" x2="228" y2="282" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="231" width="190" height="25" rx="6" fill="#ffffff"/>
  <text class="sans edge-note" x="258" y="249">cannot edit associations</text>

  <line x1="228" y1="418" x2="228" y2="492" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="441" width="196" height="25" rx="6" fill="#ffffff"/>
  <text class="sans edge-note" x="258" y="459">cannot quickly clear state</text>

  <line x1="228" y1="628" x2="228" y2="702" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="250" y="651" width="170" height="25" rx="6" fill="#ffffff"/>
  <text class="sans edge-note" x="258" y="669">scalar decay is coarse</text>

  <line x1="408" y1="143" x2="492" y2="143" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5 7"/>
  <line x1="408" y1="353" x2="492" y2="353" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5 7"/>
  <line x1="408" y1="563" x2="492" y2="563" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5 7"/>
  <line x1="408" y1="773" x2="492" y2="773" stroke="#d1d5db" stroke-width="2" stroke-dasharray="5 7"/>

  <rect x="500" y="868" width="892" height="54" rx="12" fill="#f3f4f6"/>
  <text class="mono formula" x="530" y="902">Shared readout: oₜ = Sₜᵀqₜ</text>
</svg>
